<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetal Ultrasound Clinical Reference & Calculator Suite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        medical: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                            900: '#0a3651',
                        }
                    }
                }
            }
        };
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200 text-xs">

    <!-- Compact Header Bar -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between">
            
            <!-- Left Branding -->
            <div class="flex items-center space-x-2">
                <div class="p-1.5 bg-medical-600 text-white rounded-lg shadow-sm">
                    <i class="fa-solid fa-baby text-xs"></i>
                </div>
                <h1 class="font-bold text-sm tracking-tight text-slate-900 dark:text-white hidden sm:block">Fetal Echo & US Calc</h1>
            </div>

            <!-- Categorized Selector Dropdown (Alphabetized Options) -->
            <div class="flex-1 max-w-lg mx-1">
                <label for="chartSelect" class="sr-only">Select Clinical Reference</label>
                <div class="relative">
                    <select id="chartSelect" onchange="switchDataset(this.value)" class="w-full pl-8 pr-8 py-1.5 bg-slate-100 dark:bg-slate-700/80 border border-slate-300 dark:border-slate-600 rounded-lg text-xs font-semibold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-medical-500 transition cursor-pointer appearance-none truncate">
                        <optgroup label="1. Fetal Biometry">
                            <option value="two_sd">2SD BPD, HC, AC</option>
                            <option value="crl">Crown-Rump Length (CRL)</option>
                            <option value="efw">Estimated Fetal Weight (EFW Percentiles)</option>
                            <option value="ga_ref">Gestational Age (BPD, HC, AC, FL, TCD)</option>
                        </optgroup>
                        <optgroup label="2. Long Bones & Extremities">
                            <option value="bpd_bones">BPD to Bone Length Ratios (Femur, Tibia, Fibula, Humerus, Radius)</option>
                            <option value="two_sd_ll">Lower Limb 2SD Limits (Femur, Tibia, Fibula)</option>
                            <option value="two_sd_ul">Upper Limb 2SD Limits (Humerus, Radius, Ulna)</option>
                        </optgroup>
                        <optgroup label="3. Abdomen & Organs">
                            <option value="afi">Amniotic Fluid Index (AFI)</option>
                            <option value="bladder">Bladder Bifrontal Ventricle Horn Width</option>
                            <option value="gb_length">Gall Bladder Length</option>
                            <option value="gb_td">Gall Bladder Transverse Diameter (TD)</option>
                            <option value="kidneys">Kidneys Diameter & Circumference</option>
                            <option value="ls_length">Lower Segment Length</option>
                            <option value="penis">Penile Length Percentiles (10th, Mean, 90th)</option>
                            <option value="placental">Placental Thickness</option>
                            <option value="tc_ac">Thoracic / Abdominal Ratio (TC/AC)</option>
                            <option value="colon_td">Transverse Colon Diameter</option>
                        </optgroup>
                        <optgroup label="4. Doppler & Brain">
                            <option value="mca_pi">Middle Cerebral Artery (MCA) PI</option>
                            <option value="umb_pi">Umbilical Artery PI (Umbilical PI)</option>
                            <option value="umb_ri">Umbilical Artery RI (Umbilical RI)</option>
                        </optgroup>
                    </select>
                    <i class="fa-solid fa-list-ul absolute left-2.5 top-1/2 -translate-y-1/2 text-medical-500 dark:text-medical-400 text-xs"></i>
                    <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
                </div>
            </div>

            <!-- Right Theme Toggle -->
            <div class="flex items-center">
                <button onclick="toggleDarkMode()" class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition text-xs" title="Toggle Theme">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-3 py-3 space-y-3">

        <!-- Calculator / Reference Lookup Banner -->
        <section class="bg-gradient-to-r from-medical-800 to-slate-900 rounded-xl text-white p-3 shadow-md relative overflow-hidden">
            <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="space-y-0.5">
                    <span id="categoryBadge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-medical-500/30 text-sky-200 border border-sky-400/30">
                        <i class="fa-solid fa-folder"></i> Fetal Biometry
                    </span>
                    <h2 id="activeTitle" class="text-sm font-bold tracking-tight text-white leading-tight">2SD Upper & Lower Limits</h2>
                    <p id="activeDesc" class="text-[11px] text-slate-300 line-clamp-1">Normal fetal biometry reference intervals (+/-2 Standard Deviations) for BPD, HC, and AC.</p>
                </div>

                <!-- Compact Lookup Calculator -->
                <div class="bg-white/10 backdrop-blur-md border border-white/20 p-2 rounded-lg flex items-center gap-2 shrink-0">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300" id="lookupLabel">Select GA (Wks)</label>
                        <input type="number" id="calcInput" min="1" max="100" step="1" placeholder="e.g. 28" oninput="runCalculator()" class="w-20 py-1 px-2 rounded bg-slate-900/80 border border-slate-600 text-white font-bold text-xs focus:outline-none focus:ring-1 focus:ring-sky-400">
                    </div>
                    <div id="calcOutput" class="min-w-[140px] pl-2 border-l border-white/20">
                        <span class="text-[10px] text-slate-400 block leading-none mb-0.5">Lookup Result</span>
                        <span id="calcValue" class="text-xs font-bold text-sky-300 block leading-tight">Enter value</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Dynamic Grid Content (Chart + Table) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-3">

            <!-- Chart Card (Only visible for Doppler & Brain: MCA PI, Umb PI, Umb RI) -->
            <div id="chartCard" class="hidden lg:col-span-6 bg-white dark:bg-slate-800 rounded-xl p-3 border border-slate-200 dark:border-slate-700 shadow-sm flex-col">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-line text-medical-500 text-xs"></i>
                        <h3 class="font-bold text-xs text-slate-900 dark:text-white">Doppler Waveform Visualization</h3>
                    </div>
                    <span id="formulaTag" class="hidden text-[10px] bg-sky-100 dark:bg-sky-900/50 text-sky-700 dark:text-sky-300 font-mono px-2 py-0.5 rounded border border-sky-300 dark:border-sky-700"></span>
                </div>
                <div class="relative flex-1 min-h-[260px] w-full flex items-center justify-center">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- Table Card (Dynamically expands to 12 cols when chart is hidden) -->
            <div id="tableCard" class="lg:col-span-12 bg-white dark:bg-slate-800 rounded-xl p-3 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col transition-all duration-200">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-table text-medical-500 text-xs"></i>
                        <h3 class="font-bold text-xs text-slate-900 dark:text-white">Clinical Dataset Reference Values</h3>
                    </div>
                    <!-- Search Filter -->
                    <div class="relative w-32">
                        <input type="text" id="tableFilter" onkeyup="filterTable()" placeholder="Filter..." class="w-full pl-6 pr-2 py-1 bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded text-[11px] text-slate-800 dark:text-slate-100 focus:outline-none">
                        <i class="fa-solid fa-magnifying-glass absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-[10px]"></i>
                    </div>
                </div>

                <!-- High-Density Scrollable Table -->
                <div class="flex-1 overflow-auto max-h-[620px] custom-scrollbar border border-slate-200 dark:border-slate-700/80 rounded-lg">
                    <table class="w-full text-left border-collapse text-[11px]">
                        <thead id="tableHead" class="sticky top-0 bg-slate-100 dark:bg-slate-700/90 backdrop-blur font-semibold text-slate-700 dark:text-slate-200 border-b border-slate-200 dark:border-slate-600">
                            <!-- Injected Headers -->
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50 text-slate-600 dark:text-slate-300">
                            <!-- Injected Data Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Script Data Store & Core Engine -->
    <script>
        // 19 Complete Datasets compiled precisely from extracted ultrasound charts
        const DATASETS = {
            // Category 1: Fetal Biometry
            two_sd: {
                title: "2SD BPD, HC, AC",
                category: "Fetal Biometry",
                description: "Normal fetal biometry reference intervals (+/-2 Standard Deviations) for BPD, HC, and AC.",
                lookupLabel: "GA (Weeks)",
                headers: ["GA (wk)", "BPD (mm)", "HC (mm)", "AC (mm)"],
                calc: (ga) => {
                    const row = DATASETS.two_sd.rows.find(r => r[0] == ga);
                    if(!row) return null;
                    return `BPD: ${row[1]} | HC: ${row[2]} | AC: ${row[3] || 'N/A'}`;
                },
                rows: [
                    [12, "19-25", "51-89", "-"], [13, "22-28", "65-103", "-"], [14, "25-32", "79-117", "-"], [15, "28-36", "92-130", "-"],
                    [16, "31-39", "105-143", "-"], [17, "33-43", "118-156", "-"], [18, "36-46", "131-169", "-"], [19, "39-50", "144-182", "-"],
                    [20, "42-54", "156-194", "140-170"], [21, "45-57", "168-206", "151-184"], [22, "48-60", "180-218", "161-197"],
                    [23, "51-64", "191-229", "177-210"], [24, "54-67", "202-240", "181-223"], [25, "57-70", "213-251", "191-235"],
                    [26, "60-73", "223-261", "200-247"], [27, "63-76", "233-271", "209-259"], [28, "66-79", "243-281", "217-270"],

                    [38, "87-100", "319-355", "289-360"], [39, "89-101", "322-360", "294-367"], [40, "90-102", "326-364", "300-374"],
                    [41, "91-103", "-", "304-380"], [42, "91-103", "-", "309-385"]
                ],
                showGraph: false
            },
            crl: {
                title: "Crown-Rump Length (CRL)",
                category: "Fetal Biometry",
                description: "Ultrasound dating chart mapping Crown-Rump Length (mm) to Gestational Age (Weeks+Days).",
                lookupLabel: "CRL (mm)",
                headers: ["CRL (mm)", "Gestational Age (Wks+Days)"],
                calc: (crl) => {
                    const row = DATASETS.crl.rows.find(r => {
                        if(typeof r[0] === 'number') return r[0] == crl;
                        const [min, max] = r[0].split('-').map(Number);
                        return crl >= min && crl <= max;
                    });
                    return row ? `Maturity: ${row[1]}` : null;
                },
                rows: [
                    [7, "6+2"], [8, "6+4"], [9, "6+5"], [10, "7+0"], [11, "7+1"], [12, "7+2"], [13, "7+3"], [14, "7+5"], [15, "7+6"],
                    [16, "8+0"], [17, "8+1"], [18, "8+2"], [19, "8+3"], [20, "8+4"], ["21-22", "8+5"], [23, "8+6"], [24, "9+0"], [25, "9+1"],
                    [26, "9+2"], ["27-28", "9+3"], [29, "9+4"], [30, "9+5"], ["31-32", "9+6"], [33, "10+0"], [34, "10+1"], ["35-36", "10+2"],
                    [37, "10+3"], ["38-39", "10+4"], [40, "10+5"], ["41-42", "10+6"], [43, "11+0"], ["44-45", "11+1"], ["46-47", "11+2"],

                ],
                showGraph: false
            },
            ga_ref: {

                category: "Fetal Biometry",
                description: "Standard mean reference measurements across gestational ages 12 through 42 weeks.",
                lookupLabel: "GA (Weeks)",
                headers: ["GA (wk)", "BPD (mm)", "HC (mm)", "AC (mm)", "FL (mm)", "TCD (mm)"],
                calc: (ga) => {

                    if(!row) return null;
                    return `BPD: ${row[1]} | HC: ${row[2]} | AC: ${row[3] || 'N/A'} | FL: ${row[4]} | TCD: ${row[5] || 'N/A'}`;
                },
                rows: [
                    [12, "21-23", "65-75", "-", "8-10", "9-16"], [13, "24-26", "76-93", "-", "11-13", "11"],
                    [14, "27-29", "94-104", "-", "14-16", "12"], [15, "30-33", "105-117", "-", "17-20", "13-14"],

                    [30, "77-78", "275-284", "258-266", "59-60", "34"], [31, "79-81", "285-293", "267-275", "61-62", "35-36"],
                    [32, "82-83", "294-300", "276-284", "63-64", "37-38"], [33, "84-85", "301-308", "285-292", "65-66", "39-40"],
                    [34, "86-87", "309-315", "293-300", "67-68", "41-42"], [35, "88-89", "316-321", "301-307", "69-70", "43-45"],
                    [36, "90-91", "322-327", "308-314", "71-72", "46-49"], [37, "92", "328-333", "315-321", "73", "50-"],
                    [38, "93-94", "334-338", "322-327", "74-75", "-"], [39, "95", "339-343", "328-334", "76-77", "-"],
                    [40, "96", "344-", "335-339", "78", "-"], [41, "97", "-", "340-344", "79", "-"], [42, "98", "-", "345-", "80-81", "-"]
                ],
                showGraph: false
            },

            // Category 2: Long Bones & Extremities
            bpd_bones: {
                title: "BPD to Bone Length Ratios",
                category: "Long Bones & Extremities",
                description: "Expected long bone lengths (Femur, Tibia, Fibula, Humerus, Radius in mm) matched against BPD (21-100 mm).",
                lookupLabel: "BPD (mm)",
                headers: ["BPD (mm)", "Femur (mm)", "Tibia (mm)", "Fibula (mm)", "Humerus (mm)", "Radius (mm)"],
                calc: (bpd) => {
                    const row = DATASETS.bpd_bones.rows.find(r => r[0] == bpd);
                    if(!row) return null;

                ],
                showGraph: false
            },
            two_sd_ll: {
                title: "Lower Limb 2SD Limits",
                category: "Long Bones & Extremities",
                description: "Normal reference intervals (+/-2SD in mm) for Lower Limb bones: Femur, Tibia, Fibula.",
                lookupLabel: "GA (Weeks)",
                headers: ["GA (wk)", "Femur (mm)", "Tibia (mm)", "Fibula (mm)"],
                calc: (ga) => {
                    const row = DATASETS.two_sd_ll.rows.find(r => r[0] == ga);
                    if(!row) return null;
                    return `Femur: ${row[1] || 'N/A'} | Tibia: ${row[2]} | Fibula: ${row[3]}`;
                },

        // Theme Toggle Handler
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon';
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun';
            }
            if(DATASETS[currentKey].showGraph) {
                renderChart(DATASETS[currentKey]);
            }
        }

        // Switch Active Dataset
        function switchDataset(key) {
            currentKey = key;
            const ds = DATASETS[key];

            // Metadata update
            document.getElementById('activeTitle').innerText = ds.title;
            document.getElementById('activeDesc').innerText = ds.description;
            document.getElementById('lookupLabel').innerText = ds.lookupLabel;
            document.getElementById('categoryBadge').innerHTML = `<i class="fa-solid fa-folder"></i> ${ds.category}`;

            const formulaTag = document.getElementById('formulaTag');
            if (ds.formula) {
                formulaTag.innerText = ds.formula;
                formulaTag.classList.remove('hidden');
            } else {
                formulaTag.classList.add('hidden');
            }

            // Input Resets
            document.getElementById('calcInput').value = '';
            document.getElementById('calcValue').innerText = 'Enter value';
            document.getElementById('tableFilter').value = '';

            // Handle Graph Display Toggle
            const chartCard = document.getElementById('chartCard');
            const tableCard = document.getElementById('tableCard');

            if (ds.showGraph) {
                chartCard.classList.remove('hidden');
                chartCard.classList.add('flex');
                tableCard.classList.remove('lg:col-span-12');
                tableCard.classList.add('lg:col-span-6');
                renderChart(ds);
            } else {
                chartCard.classList.add('hidden');
                chartCard.classList.remove('flex');
                tableCard.classList.remove('lg:col-span-6');
                tableCard.classList.add('lg:col-span-12');
                if (chartInstance) {
                    chartInstance.destroy();
                    chartInstance = null;
                }
            }

            renderTable(ds);
        }

        // Render Table Data
        function renderTable(ds) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');

            thead.innerHTML = `<tr>${ds.headers.map(h => `<th class="py-1.5 px-2 border-b dark:border-slate-600">${h}</th>`).join('')}</tr>`;

            tbody.innerHTML = ds.rows.map(row => `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/40 transition-colors">
                    ${row.map((cell, i) => `
                        <td class="py-1 px-2 ${i === 0 ? 'font-bold text-slate-800 dark:text-slate-200' : ''}">
                            ${cell}
                        </td>
                    `).join('')}
                </tr>
            `).join('');
        }

        // Quick Table Filter
        function filterTable() {
            const val = document.getElementById('tableFilter').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        }

        // Interactive Value Lookup Calculator
        function runCalculator() {
            const inputVal = parseFloat(document.getElementById('calcInput').value);
            const outputEl = document.getElementById('calcValue');
            const ds = DATASETS[currentKey];

            if (isNaN(inputVal)) {
                outputEl.innerText = 'Enter value';
                outputEl.className = 'text-xs font-bold text-sky-300 block leading-tight';
                return;
            }

            const res = ds.calc(inputVal);
            if (res) {
                outputEl.innerText = res;
                outputEl.className = 'text-xs font-bold text-emerald-400 block leading-tight';
            } else {
                outputEl.innerText = 'No matching entry';
                outputEl.className = 'text-xs font-bold text-amber-300 block leading-tight';
            }
        }

        // Render Doppler Chart.js
        function renderChart(ds) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }

            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#cbd5e1' : '#475569';
            const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';

            let chartConfig = {
                type: 'line',
                data: {
                    labels: ds.rows.map(r => r[0]),
                    datasets: [
                        {
                            label: ds.headers[3] || 'Upper Limit (~95th)',
                            data: ds.rows.map(r => parseFloat(r[3])),
                            borderColor: '#f43f5e',
                            borderDash: [4, 4],
                            tension: 0.3
                        },
                        {
                            label: ds.headers[2] || 'Mean / 50th',
                            data: ds.rows.map(r => parseFloat(r[2])),
                            borderColor: '#0284c7',
                            borderWidth: 2.5,
                            tension: 0.3
                        },
                        {
                            label: ds.headers[1] || 'Lower Limit (~5th)',
                            data: ds.rows.map(r => parseFloat(r[1])),
                            borderColor: '#10b981',
                            borderDash: [4, 4],
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: textColor, font: { family: 'Inter', size: 10 } }
                        },
                        tooltip: {
                            backgroundColor: isDark ? '#1e293b' : '#ffffff',
                            titleColor: isDark ? '#f8fafc' : '#0f172a',
                            bodyColor: isDark ? '#cbd5e1' : '#334155',
                            borderColor: isDark ? '#334155' : '#e2e8f0',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: textColor, font: { size: 10 } },
                            grid: { color: gridColor },
                            title: { display: true, text: ds.headers[0], color: textColor, font: { size: 10 } }
                        },
                        y: {
                            ticks: { color: textColor, font: { size: 10 } },
                            grid: { color: gridColor }
                        }
                    }
                }
            };

            chartInstance = new Chart(ctx, chartConfig);
        }
    </script>
</body>
</html>
